[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chunkin"
version = "0.1.3"
description = "Document chunking and indexing library for vector stores"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "thevyanshu", email = "thevyanshu@github.com"}
]
keywords = ["document", "chunking", "vector-store", "rag", "langchain", "embeddings", "indexing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langchain>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-community>=0.3.0",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
# Core extra (recommended for most users)
core = [
    "langchain-openai>=0.3.0",
    "faiss-cpu",
]

# Semantic chunking
semantic = [
    "langchain-experimental>=0.3.0",
]

# Local vector stores
local = [
    "langchain-chroma>=0.3.0",
    "langchain-milvus>=0.3.0",
    "langchain-lancedb>=0.3.0",
    "langchain-lambdadb>=0.3.0",
]

# AWS vector stores
aws = [
    "langchain-aws>=0.3.0",
    "boto3",
]

# Azure vector stores
azure = [
    "langchain-azure-ai>=0.3.0",
    "langchain-azure-cosmosdb>=0.3.0",
]

# Google Cloud vector stores
gcp = [
    "langchain-databricks>=0.3.0",
    "langchain-google-vertexai>=0.3.0",
    "langchain-google-community>=0.3.0",
]

# Other vector stores (Pinecone, Qdrant, Weaviate, PG, MongoDB, etc.)
other = [
    "langchain-pinecone>=0.3.0",
    "langchain-qdrant>=0.3.0",
    "langchain-weaviate>=0.3.0",
    "langchain-postgres>=0.3.0",
    "langchain-mongodb>=0.3.0",
    "langchain-astradb>=0.3.0",
    "langchain-elasticsearch>=0.3.0",
    "langchain-neo4j>=0.3.0",
    "langchain-oracledb>=0.3.0",
    "langchain-cockroachdb>=0.3.0",
    "langchain-couchbase>=0.3.0",
    "langchain-singlestore>=0.3.0",
    "langchain-supabase>=0.3.0",
    "langchain-myscale>=0.3.0",
    "langchain-zilliz>=0.3.0",
    "langchain-meilisearch>=0.3.0",
    "langchain-typesense>=0.3.0",
    "langchain-vectara>=0.3.0",
    "langchain-marqo>=0.3.0",
    "langchain-deeplake>=0.3.0",
    "langchain-turbopuffer>=0.3.0",
]

# All vector stores + embeddings
all = [
    "langchain-openai>=0.3.0",
    "langchain-experimental>=0.3.0",
    "langchain-chroma>=0.3.0",
    "langchain-milvus>=0.3.0",
    "langchain-lancedb>=0.3.0",
    "langchain-lambdadb>=0.3.0",
    "langchain-aws>=0.3.0",
    "langchain-azure-ai>=0.3.0",
    "langchain-azure-cosmosdb>=0.3.0",
    "langchain-databricks>=0.3.0",
    "langchain-google-vertexai>=0.3.0",
    "langchain-google-community>=0.3.0",
    "langchain-pinecone>=0.3.0",
    "langchain-qdrant>=0.3.0",
    "langchain-weaviate>=0.3.0",
    "langchain-postgres>=0.3.0",
    "langchain-mongodb>=0.3.0",
    "langchain-astradb>=0.3.0",
    "langchain-elasticsearch>=0.3.0",
    "langchain-neo4j>=0.3.0",
    "langchain-oracledb>=0.3.0",
    "langchain-cockroachdb>=0.3.0",
    "langchain-couchbase>=0.3.0",
    "langchain-singlestore>=0.3.0",
    "langchain-supabase>=0.3.0",
    "langchain-myscale>=0.3.0",
    "langchain-zilliz>=0.3.0",
    "langchain-meilisearch>=0.3.0",
    "langchain-typesense>=0.3.0",
    "langchain-vectara>=0.3.0",
    "langchain-marqo>=0.3.0",
    "langchain-deeplake>=0.3.0",
    "langchain-turbopuffer>=0.3.0",
    "faiss-cpu",
]

# Development dependencies
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/thevyanshu/chunkin"
Documentation = "https://thevyanshu.github.io/chunkin"
Repository = "https://github.com/thevyanshu/chunkin"
Issues = "https://github.com/thevyanshu/chunkin/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["chunkin*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"